name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Check disk space
      if: matrix.os == 'ubuntu-latest'
      run: |
        df -h

    - name: Clean up space (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        df -h

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Install optional development dependencies
      run: |
        pip install --no-cache-dir black>=23.0.0 flake8 mypy pytest>=7.4.0

    - name: Clean pip cache
      if: matrix.os == 'ubuntu-latest'
      run: |
        pip cache purge || true
        df -h

    - name: Check code formatting with Black
      run: |
        black --check --diff . || true
      continue-on-error: true

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy . --ignore-missing-imports --no-strict-optional
      continue-on-error: true

    - name: Verify imports
      run: |
        python -c "import sys; sys.path.insert(0, '.'); import config; print('✓ config OK')" || echo "⚠ config import issue"
        python -c "import sys; sys.path.insert(0, '.'); import document_processing; print('✓ document_processing OK')" || echo "⚠ document_processing import issue"
        python -c "import sys; sys.path.insert(0, '.'); import indexing; print('✓ indexing OK')" || echo "⚠ indexing import issue"
        python -c "import sys; sys.path.insert(0, '.'); import retrieval; print('✓ retrieval OK')" || echo "⚠ retrieval import issue"
        python -c "import sys; sys.path.insert(0, '.'); import prompting; print('✓ prompting OK')" || echo "⚠ prompting import issue"
        python -c "import sys; sys.path.insert(0, '.'); import tools; print('✓ tools OK')" || echo "⚠ tools import issue"
      continue-on-error: true

    - name: Test tools.py CLI help
      run: |
        python tools.py --help || echo "CLI help check completed"
      continue-on-error: true

  integration-test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:6333/health || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Check disk space
      run: |
        df -h

    - name: Clean up space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        df -h

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Clean pip cache
      run: |
        pip cache purge || true
        df -h

    - name: Install curl
      run: |
        sudo apt-get update && sudo apt-get install -y curl || true

    - name: Wait for Qdrant to be ready
      run: |
        echo "Waiting for Qdrant to be ready..."
        for i in {1..30}; do
          if curl -f http://localhost:6333/health 2>/dev/null; then
            echo "Qdrant is ready!"
            break
          fi
          echo "Attempt $i/30: Qdrant not ready yet, waiting..."
          sleep 2
        done
        curl -f http://localhost:6333/health || (echo "Qdrant health check failed" && exit 1)

    - name: Test indexing and search
      run: |
        python tools.py --index --search "What is Qdrant?" --topk 3
      env:
        QDRANT_HOST: http://localhost
        QDRANT_PORT: 6333

    - name: Test snapshot creation
      run: |
        python tools.py --snapshot
      env:
        QDRANT_HOST: http://localhost
        QDRANT_PORT: 6333

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install safety
      run: |
        pip install safety

    - name: Run safety check
      run: |
        safety check --file requirements.txt
      continue-on-error: true
