name: Quick Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax check
      run: |
        python -m py_compile tools.py config.py document_processing.py indexing.py retrieval.py prompting.py mini_rag_pipeline_qdrant.py

    - name: Import check
      run: |
        python -c "import tools; import config; print('✓ All imports successful')"
