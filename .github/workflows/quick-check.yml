name: Quick Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Check disk space
      run: |
        df -h

    - name: Clean up space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        df -h

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Clean pip cache
      run: |
        pip cache purge || true
        df -h

    - name: Syntax check
      run: |
        python -m py_compile tools.py config.py document_processing.py indexing.py retrieval.py prompting.py mini_rag_pipeline_qdrant.py

    - name: Import check
      run: |
        python -c "import tools; import config; print('✓ All imports successful')"
