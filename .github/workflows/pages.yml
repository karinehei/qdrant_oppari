# Julkaisee vain rakennetun web/dist-hakemiston.
# workflow_dispatch ei käynnisty tästä commitista. Pages-ympäristöä ei oteta käyttöön tässä muutoksessa.
# Tiukka tarkistus pysäyttää julkaisun, jos aineellinen julkaisuristiriita on auki.
name: GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate recorded results
        run: |
          python -m pip install --no-cache-dir pytest
          python -m pytest tests/test_website_export.py -q
          python scripts/website_export.py --strict-publication

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test and build frontend
        working-directory: web
        run: |
          npm test
          npm run build:demo

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
